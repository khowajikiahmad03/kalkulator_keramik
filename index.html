<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Kalkulator Keramik</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1> KALKULATOR KERAMIK RUMAH</h1>
    <p>Masukkan ukuran rumah dan keramik untuk menghitung jumlah keramik yang dibutuhkan.</p>

    <label>Panjang Rumah (m):</label>
    <input type="number" id="panjangRumah" placeholder="contoh: 10">

    <label>Lebar Rumah (m):</label>
    <input type="number" id="lebarRumah" placeholder="contoh: 8">

    <label>Panjang Keramik (cm):</label>
    <input type="number" id="panjangKeramik" placeholder="contoh: 40">

    <label>Lebar Keramik (cm):</label>
    <input type="number" id="lebarKeramik" placeholder="contoh: 40">

    <button onclick="hitungKeramik()">Hitung</button>

    <div id="hasil"></div>
  </div>
  <script src="script.js"></script>
</body>
</html>
